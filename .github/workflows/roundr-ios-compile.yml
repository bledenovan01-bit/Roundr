name: Roundr iOS native compile
# Compiles the local Swift modules for the iOS simulator. No signing, no Apple
# account, no EAS and no artifact: it only proves that the native code builds.
on:
  pull_request:
    branches: ["codex/**", "main"]
    paths:
      - "frontend/modules/**"
      - "frontend/app.json"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - ".github/workflows/roundr-ios-compile.yml"
  workflow_dispatch:
concurrency:
  group: roundr-ios-compile-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile:
    name: compile (Spotify experiment ${{ matrix.spotify }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        spotify: ["0", "1"]
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      ROUNDR_SPOTIFY_EXPERIMENT: ${{ matrix.spotify }}
      # Compile-only placeholder: the Client ID is not a secret and this one is not real.
      ROUNDR_SPOTIFY_CLIENT_ID: compile-only-placeholder
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Check that the Spotify SDK is linked only in the experiment
        run: |
          if [ "$ROUNDR_SPOTIFY_EXPERIMENT" = "1" ]; then
            test -d modules/roundr-spotify-remote/ios/vendor/SpotifyiOS.xcframework
            /usr/libexec/PlistBuddy -c "Print :RoundrSpotifyClientID" ios/Roundr/Info.plist
          else
            test ! -e modules/roundr-spotify-remote/ios/vendor
            ! /usr/libexec/PlistBuddy -c "Print :RoundrSpotifyClientID" ios/Roundr/Info.plist
          fi
      - name: Show the compiler used here
        run: xcodebuild -version
      - name: Check the generated iOS project
        run: |
          P=ios/Roundr/Info.plist
          X=ios/Roundr.xcodeproj/project.pbxproj
          ICONS=ios/Roundr/Images.xcassets/AppIcon.appiconset
          failed=0
          # Every check runs and reports by name, so one failure cannot hide another.
          check() {
            label="$1"; shift
            if "$@"; then echo "OK    $label"; else echo "::error::ECHEC $label"; failed=1; fi
          }
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$P"; }
          plist_is() { [ "$(plist "$1")" = "$2" ]; }
          plist_has() { plist "$1" | grep -q "$2"; }
          absent() { ! "$@"; }
          # Expo writes the identifier between quotes; every configuration must carry it.
          bundle_is_roundr() {
            values="$(grep -E 'PRODUCT_BUNDLE_IDENTIFIER =' "$X")"
            [ -n "$values" ] && ! echo "$values" | grep -Ev 'PRODUCT_BUNDLE_IDENTIFIER = "?com\.bledenovan\.roundr"?;' | grep -q .
          }
          icons_are_opaque() {
            found=0
            for icon in "$ICONS"/*.png; do
              [ -f "$icon" ] || return 1
              found=1
              sips -g hasAlpha "$icon" | grep -q 'hasAlpha: no' || return 1
            done
            [ "$found" = "1" ]
          }
          check "Identifiant iOS com.bledenovan.roundr" bundle_is_roundr
          check "iPhone uniquement" grep -Eq 'TARGETED_DEVICE_FAMILY = "?1"?;' "$X"
          check "Pas de cible iPad" absent grep -Eq 'TARGETED_DEVICE_FAMILY = "?1,2"?;' "$X"
          # Required for apps built with Xcode 27 to launch on iOS 27.
          check "SceneDelegate present" test -f ios/Roundr/SceneDelegate.swift
          check "Manifeste de scenes present" grep -q UIApplicationSceneManifest "$P"
          check "Chiffrement declare a false" plist_is ITSAppUsesNonExemptEncryption false
          check "Schema d URL roundr" plist_has CFBundleURLTypes roundr
          check "Texte d autorisation Musique" plist NSAppleMusicUsageDescription
          check "Pas de demande de micro" absent grep -q NSMicrophoneUsageDescription "$P"
          check "Aucune reference Emergent" absent grep -ril emergent ios --exclude-dir=Pods --exclude-dir=build
          check "Icones sans transparence" icons_are_opaque
          if [ "$ROUNDR_SPOTIFY_EXPERIMENT" = "1" ]; then
            check "Retour Spotify roundr://spotify-login-callback" plist_is RoundrSpotifyRedirectURL roundr://spotify-login-callback
            check "Requete de l app Spotify autorisee" plist_has LSApplicationQueriesSchemes spotify
          else
            check "Aucune configuration Spotify" absent plist RoundrSpotifyClientID
          fi
          echo "--- Valeurs observees"
          grep -nE 'PRODUCT_BUNDLE_IDENTIFIER =|TARGETED_DEVICE_FAMILY =' "$X" || true
          exit "$failed"
      - name: Install pods
        working-directory: frontend/ios
        run: pod install
      - name: Compile for the iOS simulator
        working-directory: frontend/ios
        run: >
          xcodebuild build
          -workspace Roundr.xcworkspace
          -scheme Roundr
          -configuration Debug
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          -quiet
