name: Roundr iOS native compile
# Compiles the local Swift modules for the iOS simulator. No signing, no Apple
# account, no EAS and no artifact: it only proves that the native code builds.
on:
  pull_request:
    branches: ["codex/**", "main"]
    paths:
      - "frontend/modules/**"
      - "frontend/app.json"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - ".github/workflows/roundr-ios-compile.yml"
  workflow_dispatch:
concurrency:
  group: roundr-ios-compile-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile:
    name: compile (Spotify experiment ${{ matrix.spotify }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        spotify: ["0", "1"]
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      ROUNDR_SPOTIFY_EXPERIMENT: ${{ matrix.spotify }}
      # Compile-only placeholder: the Client ID is not a secret and this one is not real.
      ROUNDR_SPOTIFY_CLIENT_ID: compile-only-placeholder
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Check that the Spotify SDK is linked only in the experiment
        run: |
          if [ "$ROUNDR_SPOTIFY_EXPERIMENT" = "1" ]; then
            test -d modules/roundr-spotify-remote/ios/vendor/SpotifyiOS.xcframework
            /usr/libexec/PlistBuddy -c "Print :RoundrSpotifyClientID" ios/Roundr/Info.plist
          else
            test ! -e modules/roundr-spotify-remote/ios/vendor
            ! /usr/libexec/PlistBuddy -c "Print :RoundrSpotifyClientID" ios/Roundr/Info.plist
          fi
      - name: Show the compiler used here
        run: xcodebuild -version
      - name: Check the generated iOS project
        run: |
          P=ios/Roundr/Info.plist
          X=ios/Roundr.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.bledenovan.roundr;' "$X"
          grep -Eq 'TARGETED_DEVICE_FAMILY = "?1"?;' "$X"
          # Required for apps built with Xcode 27 to launch on iOS 27.
          test -f ios/Roundr/SceneDelegate.swift
          grep -q UIApplicationSceneManifest "$P"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$P")" = "false"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$P" | grep -q roundr
          /usr/libexec/PlistBuddy -c 'Print :NSAppleMusicUsageDescription' "$P"
          if grep -q 'NSMicrophoneUsageDescription' "$P"; then exit 1; fi
          if grep -ril emergent ios --exclude-dir=Pods --exclude-dir=build; then exit 1; fi
          for icon in ios/Roundr/Images.xcassets/AppIcon.appiconset/*.png; do
            sips -g hasAlpha "$icon" | grep -q 'hasAlpha: no'
          done
          if [ "$ROUNDR_SPOTIFY_EXPERIMENT" = "1" ]; then
            test "$(/usr/libexec/PlistBuddy -c 'Print :RoundrSpotifyRedirectURL' "$P")" = "roundr://spotify-login-callback"
            /usr/libexec/PlistBuddy -c 'Print :LSApplicationQueriesSchemes' "$P" | grep -q spotify
          fi
      - name: Install pods
        working-directory: frontend/ios
        run: pod install
      - name: Compile for the iOS simulator
        working-directory: frontend/ios
        run: >
          xcodebuild build
          -workspace Roundr.xcworkspace
          -scheme Roundr
          -configuration Debug
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          -quiet
