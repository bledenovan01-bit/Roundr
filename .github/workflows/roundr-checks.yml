name: Roundr checks
on:
  push:
    branches: ["codex/roundr-test-feedback-fixes", "codex/roundr-storage-reliability", "codex/roundr-native-preview", "codex/roundr-lovable-phase-1", "codex/roundr-lovable-phase-2a", "codex/roundr-lovable-phase-2b", "codex/roundr-lovable-phase-3a", "codex/roundr-lovable-phase-3b", "codex/roundr-lovable-phase-4a", "codex/roundr-lovable-phase-4b"]
  pull_request:
    branches: ["codex/roundr-v0-freeze-fixes", "codex/roundr-native-preview", "codex/roundr-lovable-phase-1", "codex/roundr-lovable-phase-2a", "codex/roundr-lovable-phase-2b", "codex/roundr-lovable-phase-3a", "codex/roundr-lovable-phase-3b", "codex/roundr-lovable-phase-4a", "main"]
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated test compiler
        run: npm install --prefix /tmp/roundr-tools --ignore-scripts --no-package-lock typescript@6.0.3
      - name: Check TypeScript syntax
        working-directory: frontend
        env:
          NODE_PATH: /tmp/roundr-tools/node_modules
        run: npm run test:syntax
      - name: Test chrono, tournaments, announcements and persistence
        working-directory: frontend
        env:
          NODE_PATH: /tmp/roundr-tools/node_modules
        run: npm test
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile
      - name: Check types
        run: npm run typecheck
      - name: Bundle Android, iOS and web
        env:
          CI: "1"
        run: npx expo export --platform all --output-dir /tmp/roundr-export

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile
      - name: Lint (existing failures remain visible)
        run: npm run lint
